<style>/* Яркий игровой стиль: у каждого предмета свой цвет (--sc), «объёмные» кнопки, крупные скругления. */
:root {
  --bg: #f4f1ff; --surface: #ffffff; --ink: #1d1838; --muted: #625d80; --line: #e2dcf5;
  --accent: #6c3cf0; --accent-ink: #ffffff; --accent-weak: #ece5ff; --accent-dark: #4b22c2; --gold: #f2a20c; --gold-weak: #fff3d6;
  --good: #14a05c; --good-weak: #dcf6e8; --good-dark: #0c7a44; --bad: #e5484d; --bad-weak: #ffe5e6; --shadow: 0 2px 0 #e2dcf5;
  --c-math: #6c3cf0; --c-qc: #f07a14; --c-sci: #12a36a; --c-kk: #0a84d6; --c-ru: #e0405a; --c-en: #c43dc2;
  --t-math: #efe9ff; --t-qc: #fff0e1; --t-sci: #e1f7ec; --t-kk: #e2f2fd; --t-ru: #ffe8ec; --t-en: #fbe8fb;
  --f-display: "Nunito", "Segoe UI", system-ui, sans-serif; --f-body: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13112a; --surface: #1e1a3d; --ink: #f1eeff; --muted: #aaa4cf; --line: #352f63;
  --accent: #9d7bff; --accent-ink: #160b3a; --accent-weak: #2c2463; --accent-dark: #6c4fd6; --gold: #ffc14d; --gold-weak: #3b2e10;
  --good: #3fd68b; --good-weak: #12392a; --good-dark: #23a466; --bad: #ff7378; --bad-weak: #45192a; --shadow: 0 2px 0 #0b0920;
  --c-math: #a58bff; --c-qc: #ffa057; --c-sci: #3fd69a; --c-kk: #4cb4ff; --c-ru: #ff7891; --c-en: #f07ef0;
  --t-math: #2a2160; --t-qc: #3a2716; --t-sci: #133a2c; --t-kk: #12304a; --t-ru: #3f1a27; --t-en: #3a1a40; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13112a; --surface: #1e1a3d; --ink: #f1eeff; --muted: #aaa4cf; --line: #352f63;
  --accent: #9d7bff; --accent-ink: #160b3a; --accent-weak: #2c2463; --accent-dark: #6c4fd6; --gold: #ffc14d; --gold-weak: #3b2e10;
  --good: #3fd68b; --good-weak: #12392a; --good-dark: #23a466; --bad: #ff7378; --bad-weak: #45192a; --shadow: 0 2px 0 #0b0920;
  --c-math: #a58bff; --c-qc: #ffa057; --c-sci: #3fd69a; --c-kk: #4cb4ff; --c-ru: #ff7891; --c-en: #f07ef0;
  --t-math: #2a2160; --t-qc: #3a2716; --t-sci: #133a2c; --t-kk: #12304a; --t-ru: #3f1a27; --t-en: #3a1a40; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.55; margin: 0; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.55rem; letter-spacing: -.01em; }
h2 { font-size: 1.08rem; }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 18px 32px; display: flex; flex-direction: column; gap: 16px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 960px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 600; font-size: 1rem; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .95rem; }
.langs { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--bg); }
.seg-l { font-size: .74rem; color: var(--muted); padding: 0 8px 0 12px; letter-spacing: .02em; }
.seg button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: .8rem; font-weight: 600; padding: 6px 10px; min-height: 34px; cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.nav { border-top: 1px solid var(--line); }
.nav-in { max-width: 960px; margin: 0 auto; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 0 max(8px, env(safe-area-inset-right, 0px)) 0 max(8px, env(safe-area-inset-left, 0px)); }
.nav-in::-webkit-scrollbar { display: none; }
.nav-i { white-space: nowrap; text-decoration: none; color: var(--muted); padding: 10px 12px; font-size: .92rem; border-bottom: 3px solid transparent; }
.nav-i.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.ph { padding-top: 6px; } .lead { color: var(--muted); max-width: 65ch; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.hero { border-color: var(--accent); background: linear-gradient(0deg, var(--surface), var(--surface)), var(--surface); box-shadow: inset 4px 0 0 var(--accent); }
.card.hl { box-shadow: inset 4px 0 0 var(--gold); }
.card.official p, .card.official li { max-width: 72ch; }
.card > :last-child { margin-bottom: 0; }
.grid2, .grid3 { display: grid; gap: 16px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: repeat(3, 1fr); } }
.stat .k { font-size: .8rem; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.stat .big { font-family: var(--f-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; margin: 2px 0; }
.muted { color: var(--muted); } .sm { font-size: .85rem; }
.row { display: flex; gap: 10px; align-items: center; } .wrap-row { flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: .95rem; font-weight: 600; min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.gold { background: var(--gold-weak); border-color: var(--gold); color: var(--ink); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .85rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.note { background: var(--accent-weak); border-radius: 10px; padding: 10px 14px; margin: 0; }
.note.bad { background: var(--bad-weak); color: var(--ink); } .note.ok { background: var(--good-weak); margin-top: 12px; } .note.warn { background: var(--gold-weak); } .note.hint { background: var(--gold-weak); margin-top: 12px; }
.pill { display: inline-block; font-size: .75rem; padding: 2px 9px; border-radius: 999px; background: var(--accent-weak); color: var(--ink); font-family: var(--f-body); font-weight: 600; vertical-align: middle; }
.pill.soft { background: var(--bg); border: 1px solid var(--line); font-weight: 500; } .pill.warn { background: var(--gold-weak); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { text-decoration: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--bg); font-size: .9rem; }
.chip.warn { border-color: var(--gold); background: var(--gold-weak); }
.list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; }
.li.done { opacity: .6; } .li > label { flex: 1 1 260px; min-width: 0; }
.chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; } .chk input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.sh { margin-top: 10px; font-size: 1.15rem; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-height: 108px; }
.tile:hover { border-color: var(--accent); } .tn { font-weight: 600; } .tm { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.lv { align-self: flex-start; font-size: .75rem; padding: 2px 8px; border-radius: 999px; margin-top: auto; }
.lv-none { background: var(--bg); color: var(--muted); border: 1px solid var(--line); } .lv-weak { background: var(--bad-weak); color: var(--bad); } .lv-mid { background: var(--gold-weak); color: var(--ink); } .lv-strong { background: var(--good-weak); color: var(--good); }
ul.th, ol.th, ol.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; max-width: 70ch; }
.steps li { padding: 6px 0; } .ansline { list-style: none; margin-left: -1.3em; }
.tblwrap { overflow-x: auto; margin: 10px 0; -webkit-overflow-scrolling: touch; }
table.qt { border-collapse: collapse; font-size: .92rem; font-variant-numeric: tabular-nums; min-width: 100%; }
.qt th, .qt td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.qt th { background: var(--bg); font-weight: 600; } .ind { padding-left: 14px; display: inline-block; color: var(--muted); }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.05; margin: 0 2px; }
.fr > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.fr > span:last-child { padding: 0 3px; }
.nowrap { white-space: nowrap; }
svg.chart, svg.fig { display: block; max-width: 100%; height: auto; margin: 12px 0; }
svg.chart { width: 380px; } svg.fig { width: 300px; }
svg .grid { stroke: var(--line); stroke-width: 1; } svg .ax { fill: var(--muted); font-size: 12px; font-family: var(--f-body); }
svg .bar { fill: var(--accent); } svg .shape { fill: var(--accent-weak); stroke: var(--accent); stroke-width: 2; } svg .gl { stroke: var(--ink); stroke-width: 1.5; }
/* Прохождение */
.runbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); z-index: 3; }
.rb-t { font-weight: 600; } .timer { display: flex; flex-direction: column; align-items: flex-end; }
.timer b { font-family: var(--f-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.timer .muted { font-size: .75rem; }
.qgrid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.qgrid summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.qg-h { margin: 10px 0 6px; font-size: .9rem; } .qg-b { display: flex; flex-wrap: wrap; gap: 6px; }
.qn { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; font-size: .85rem; cursor: pointer; font-variant-numeric: tabular-nums; position: relative; }
.qn.ans { background: var(--accent-weak); border-color: var(--accent); } .qn.cur { outline: 3px solid var(--accent); outline-offset: 1px; font-weight: 700; }
.qn.flg::after { content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.qn.ok { background: var(--good-weak); border-color: var(--good); } .qn.bad { background: var(--bad-weak); border-color: var(--bad); } .qn.lck { opacity: .55; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.qmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.stem { font-size: 1.08rem; min-width: 0; overflow-wrap: anywhere; } .stem p { margin: 0 0 .6em; }
.passage { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; max-height: 52vh; overflow-y: auto; font-size: 1rem; }
.ptitle { font-weight: 700; margin-bottom: 6px; font-family: var(--f-display); font-size: .95rem; }
.pre { margin-bottom: 10px; }
.qc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.qcc { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-width: 0; }
.qch { background: var(--bg); padding: 6px 12px; font-size: .82rem; font-weight: 700; color: var(--muted); letter-spacing: .03em; }
.qcv { padding: 12px; font-size: 1.05rem; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; font-size: 1.02rem; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; cursor: pointer; width: 100%; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .lt { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); font-weight: 700; font-size: .9rem; }
.opt .ot { min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--accent); background: var(--accent-weak); } .opt.sel .lt { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-weak); } .opt.right .lt { background: var(--good); color: var(--surface); border-color: var(--good); }
.opt.wrongpick { border-color: var(--bad); background: var(--bad-weak); } .opt.wrongpick .lt { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.fb { border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); } .fb p { margin: 8px 0 0; max-width: 72ch; }
.fb.good { background: var(--good-weak); border-color: var(--good); } .fb.badc { background: var(--bad-weak); border-color: var(--bad); }
.fb-h { font-weight: 700; font-family: var(--f-display); }
.navbar { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; position: sticky; bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); padding: 10px 0; z-index: 2; }
.navbar .btn:first-child { justify-self: start; } .navbar .btn:last-child { justify-self: end; }
.navbar .btn { min-width: 110px; }
.endrow { justify-content: flex-end; }
.rev { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.ri, .mcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--surface); }
.ri summary, .mcard summary { cursor: pointer; } .ri.okc { border-left: 4px solid var(--good); } .ri.badc { border-left: 4px solid var(--bad); }
.ri[open] .stem, .mcard[open] .stem { margin: 10px 0; }
.rn { font-variant-numeric: tabular-nums; font-weight: 700; }
.mcard.st-new { border-left: 4px solid var(--bad); } .mcard.st-work { border-left: 4px solid var(--gold); } .mcard.st-later { border-left: 4px solid var(--accent); } .mcard.st-fixed { border-left: 4px solid var(--good); }
.mcard .pill.st { background: var(--bg); border: 1px solid var(--line); }
.mrow, .filters { display: flex; flex-wrap: wrap; gap: 12px; margin: 10px 0; }
.mrow label, .filters label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
select, textarea, input[type=file] { font: inherit; font-size: .95rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 42px; max-width: 100%; }
.ta { width: 100%; min-height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; margin: 10px 0; }
.dyn { padding: 10px 0; border-bottom: 1px solid var(--line); } .dyn:last-child { border-bottom: 0; }
.foot { padding-block: 10px 40px; color: var(--muted); font-size: .85rem; } .foot p { max-width: 75ch; margin: 4px 0; }
.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 17, .5); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; border: 1px solid var(--line); }
.modal .row { justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
@media (max-width: 560px) {
  body { font-size: 16px; } h1 { font-size: 1.3rem; }
  .top-in { padding-top: 8px; } .langs { gap: 6px; } .seg-l { padding: 0 5px 0 9px; font-size: .66rem; } .seg button { padding: 5px 8px; min-height: 32px; font-size: .74rem; }
  .runbar { position: static; padding: 8px 12px; }
  .qc { grid-template-columns: 1fr; }
  .navbar .btn { min-width: 0; padding: 8px 10px; }
  .card, .qcard { padding: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

/* ===== Игровой слой ===== */
.s-math { --sc: var(--c-math); --st: var(--t-math); } .s-qc { --sc: var(--c-qc); --st: var(--t-qc); } .s-sci { --sc: var(--c-sci); --st: var(--t-sci); }
.s-kk { --sc: var(--c-kk); --st: var(--t-kk); } .s-ru { --sc: var(--c-ru); --st: var(--t-ru); } .s-en { --sc: var(--c-en); --st: var(--t-en); }
body { font-weight: 500; }
h1, h2, .brand, .stat .big, .timer b, .fb-h, .ptitle, .tn { font-weight: 800; }
h1 { font-size: 1.75rem; }
.top { border-bottom: 0; box-shadow: 0 2px 0 var(--line); }
.mark { border-radius: 10px; background: linear-gradient(135deg, var(--c-math), var(--c-en)); color: #fff; font-weight: 900; box-shadow: 0 3px 0 var(--accent-dark); }
.nav-i { font-weight: 700; border-radius: 12px 12px 0 0; }
.nav-i.on { color: var(--accent); border-bottom-color: var(--accent); background: var(--accent-weak); }
.seg { border-width: 2px; } .seg button { font-weight: 800; }
.card { border: 2px solid var(--line); box-shadow: var(--shadow); }
.card.hero { border-color: var(--accent); background: var(--accent-weak); box-shadow: 0 4px 0 var(--accent); }
.btn { border: 2px solid var(--line); border-radius: 14px; font-weight: 800; box-shadow: 0 3px 0 var(--line); transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.btn.pri { background: var(--accent); border-color: var(--accent); box-shadow: 0 4px 0 var(--accent-dark); }
.btn.pri:active:not(:disabled) { box-shadow: 0 1px 0 var(--accent-dark); }
.btn.ghost { box-shadow: none; } .btn.danger { box-shadow: 0 3px 0 var(--bad-weak); }
.pill { border-radius: 999px; font-weight: 800; }
.qmeta .pill:first-child { background: var(--sc, var(--accent)); color: #fff; }
.tile { border: 2px solid transparent; background: var(--st, var(--surface)); box-shadow: 0 4px 0 color-mix(in srgb, var(--sc, var(--line)) 35%, transparent); transition: transform .08s; }
.tile:hover { transform: translateY(-2px); border-color: var(--sc); }
.tile .tn { color: var(--ink); }
.tile::before { content: ""; width: 34px; height: 6px; border-radius: 999px; background: var(--sc); margin-bottom: 4px; }
.sh { display: flex; align-items: center; gap: 10px; }

<script>/* Ядро: генератор случайных чисел, форматирование, реестр шаблонов заданий */
var NP = (typeof window !== 'undefined' ? window : globalThis).NP = {};
NP.TPL = []; NP.byId = {}; NP.PASS = {};

NP.rng = function (seed) {

  };

NP.gcd = function (a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { var t = b; b = a % b; a = t; } return a; };

/* Число в формате KZ/RU: десятичная запятая, пробел в тысячах (от 10 000), настоящий минус */
NP.F = function (n, dec) {

  var s = String(n); var parts = s.split('.');
  var ip = parts[0];
  if (ip.length > 4) ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + ip + (parts[1] ? ',' + parts[1] : '');
};

/* Дробь в виде HTML: вертикальная запись */
NP.fr = function (n, d, mixed) {
  if (d < 0) { n = -n; d = -d; }
  var g = NP.gcd(n, d); n /= g; d /= g;

  var sign = n < 0 ? '−' : ''; n = Math.abs(n);

    return sign + w + '<span class="fr"><span>' + r + '</span><span>' + d + '</span></span>';
  }

/* То же простым текстом — для проверки уникальности */
NP.plain = function (html) { return String(html).replace(/<span class="fr"><span>(\d+)<\/span><span>(\d+)<\/span><\/span>/g, ' $1/$2').replace(/<\/?[a-zA-Z!][^>]*>/g, ' ').replace(/\s+/g, ' ').trim(); };

NP.pl = function (n, one, few, many) {
  var a = Math.abs(n) % 100, b = a % 10;

NP.L = function (kk, ru) { return { kk: kk, ru: ru }; };

NP.T = function (def) {

/* Таблица в HTML */
NP.table = function (head, rows) {

/* Столбчатая диаграмма SVG; цвета берутся из CSS-переменных */

NP.QCOPT = {
  kk: ['А бағанындағы шама үлкен', 'В бағанындағы шама үлкен', 'Екі шама тең', 'Ақпарат жеткіліксіз'],

NP.cmp = function (a, b) { return Math.abs(a - b) < 1e-9 ? 2 : (a > b ? 0 : 1); };

/* Сборка экземпляра задания по шаблону и зерну. Детерминирована: (id, seed) → одно и то же задание. */
NP.build = function (id, seed) {
  var tpl = NP.byId[id];
  if (!tpl) return null;
  var last = null;
  for (var k = 0; k < 40; k++) {
    var r = NP.rng((seed + k * 7919) >>> 0);
    var g = tpl.g(r);
    if (!g) continue;
    var inst = NP._assemble(tpl, g, r);
    if (inst && inst.ok) { inst.seed = seed; return inst; }
    last = inst;
  }
  if (last) { last.seed = seed; last.bad = true; }
  return last;

NP._assemble = function (tpl, g, r) {

    var ans = g.ans !== undefined ? g.ans : NP.cmp(g.va, g.vb);

    ['kk', 'ru'].forEach(function (lg) {
      var pick = function (x) { return x === undefined ? '' : (typeof x === 'object' ? x[lg] : x); };
      var whys = [0, 1, 2, 3].map(function (i) {
        if (i === ans) return '';
        if (g.tl === i && g.tr) return pick(g.tr);
        return lg === 'kk' ? 'Екі бағандағы шаманы толық есептеп, содан кейін салыстырыңыз.' : 'Полностью вычислите значения в обеих колонках и только потом сравнивайте.';
      });
      inst.L[lg] = {
        stem: (g.pre ? '<div class="pre">' + pick(g.pre) + '</div>' : '') + '<div class="qc"><div class="qcc"><div class="qch">' + (lg === 'kk' ? 'А бағаны' : 'Колонка А') + '</div><div class="qcv">' + pick(g.A) + '</div></div><div class="qcc"><div class="qch">' + (lg === 'kk' ? 'В бағаны' : 'Колонка В') + '</div><div class="qcv">' + pick(g.B) + '</div></div></div>',
        opts: NP.QCOPT[lg].slice(), whys: whys, h: pick(g.h),
        e: pick(g.e) + ' ' + (lg === 'kk' ? 'Жауабы: ' : 'Ответ: ') + 'ABCD'[ans] + ' — ' + NP.QCOPT[lg][ans].toLowerCase() + '.'
      };
    });
    return inst;
  }
  inst.type = 'mc';
  var fixed = g.fixed; inst.fixed = fixed || null;
  if (g.pass) inst.pass = g.pass;
  var vals = [g.a].concat(g.w.map(function (x) { return x[0]; }));
  ['kk', 'ru'].forEach(function (lg) {
    var pv = vals.map(function (v) { return NP.plain(v !== null && typeof v === 'object' ? v[lg] : v); });
    for (var i = 0; i < pv.length; i++) { if (!pv[i]) inst.ok = false; for (var j = i + 1; j < pv.length; j++) if (pv[i] === pv[j]) inst.ok = false; }
  });
  if (vals.length !== 4) inst.ok = false;
  var order = g.keepOrder ? [0, 1, 2, 3] : r.shuffle([0, 1, 2, 3]);
  inst.ans = order.indexOf(0);
  ['kk', 'ru'].forEach(function (lg) {
    var pick = function (x) { return x === undefined ? '' : (typeof x === 'object' && x !== null && !Array.isArray(x) ? x[lg] : x); };
    var whyAll = [''].concat(g.w.map(function (x) { return pick(x[1]); }));
    var passHtml = '';
    if (g.pass && NP.PASS[g.pass]) passHtml = '<div class="passage" lang="' + NP.PASS[g.pass].lang + '"><div class="ptitle">' + NP.PASS[g.pass].title + '</div>' + NP.PASS[g.pass].html + '</div>';
    inst.L[lg] = {
      stem: passHtml + '<div class="qtext">' + pick(g.q) + '</div>',
      opts: order.map(function (o) { return pick(vals[o]); }),
      whys: order.map(function (o) { return whyAll[o]; }),
      h: pick(g.h), e: pick(g.e)
    };
  });

};

;
/* Банк заданий: Математика (+ логика и пространственное мышление в математическом блоке).

(function () {

           'Бак заполнен водой на ' + P + '. На полив цветов израсходовали ' + U + ' этой воды. Какая часть бака теперь заполнена водой?'),

  Tp('frac', 'math', 'Бөлшектер', 'Дроби', les(

    ['Теңдеуді шешу — белгісізді тепе-теңдікті бұзбай оқшаулау.', 'Жақшаны ашқанда жақша ішіндегі әр мүшені көбейтеміз.', 'Мүшені теңдіктің екінші жағына көшіргенде таңбасын өзгертеміз.', 'Мәтінді есепте: белгісізді x деп белгілеп, шартты теңдікке айналдырыңыз.', 'Соңында тексеріңіз: табылған мәнді шартқа қойыңыз.'],

  Tp('seq', 'math', 'Заңдылықтар мен тізбектер', 'Закономерности и последовательности', les(
    ['Алдымен көршілес мүшелердің айырымдарын жазыңыз. Айырым тұрақты болса — арифметикалық тізбек.', 'Айырымдар өзгерсе, «айырымдардың айырымын» немесе қатынасты (неше есе?) тексеріңіз.', 'Кейде екі тізбек кезектесіп тұрады: тақ және жұп орындарды бөлек қараңыз.', 'n-мүше: a₁ + (n − 1) · d. Бірінші мүшеден n-мүшеге дейін n − 1 қадам бар.', 'Фигуралық заңдылықта: 1, 2, 3-фигураларды санап, формуланы табыңыз.'],

    h += '<div class="grid3">' + card('<div class="k">' + esc(t(TX.c)) + '</div><div class="big">' + a.c + ' / ' + a.n + '</div>', 'stat') + card('<div class="k">' + esc(t(L('Серия', 'Серия'))) + '</div><div class="big">' + st.streak + '</div><div class="muted">' + esc(t(L('күн қатарынан', 'дней подряд'))) + '</div>', 'stat') + card('<div class="k">' + esc(t(L('Уақыт', 'Время'))) + '</div><div class="big">' + Math.max(1, Math.round((a.dur || 0) / 60000)) + ' ' + esc(t(TX.min)) + '</div><div class="muted">' + esc(t(L('тек ақпарат үшін', 'просто для информации'))) + '</div>', 'stat') + '</div>';
    h += card('<h2>' + esc(t(L('Раундтар бойынша', 'По раундам'))) + '</h2>' + NP.table([esc(t(L('Раунд', 'Раунд'))), esc(t(TX.c))], (a.rounds || []).map(function (r, ri) { var xs = a.items.filter(function (x) { return x.r === ri; }); return [esc(t(r.title)), xs.filter(function (x) { return x.ok; }).length + ' / ' + xs.length]; })));
    if (a.enPlaced) h += card('<h2>English</h2><p>' + esc(t(L('Сенің бастапқы деңгейің: ' + a.enPlaced + ' (шамамен ' + NP.CEFR[a.enPlaced] + '). Бұл 6 тапсырмаға негізделген алғашқы баға — келесі раундтарда ол нақтыланады.', 'Твой стартовый уровень: ' + a.enPlaced + ' (примерно ' + NP.CEFR[a.enPlaced] + '). Это первая оценка по 6 заданиям — дальше она уточнится.'))) + '</p>');
    var wr = {}; a.items.forEach(function (x) { if (!x.ok) wr[x.s + ':' + x.k] = x; });
    var wk = Object.keys(wr);
    h += card('<h2>' + esc(t(L('Келесі раундтарда қайталаймыз', 'Повторим в следующих тренировках'))) + '</h2>' + (wk.length ? '<div class="chips">' + wk.map(function (k) { var x = wr[k]; return '<a class="chip" href="#learn-' + x.t + '">' + esc(t(NP.TOPICS[x.t].name)) + ' · ' + esc(t(NP.SKILL[x.k] || L(x.k, x.k))) + '</a>'; }).join('') + '</div><p class="muted sm">' + esc(t(L('Бұл дағдылар бір дұрыс жауаптан кейін «түзетілді» деп белгіленбейді — оларды кейін тағы тексереміз.', 'Эти навыки не считаются исправленными после одного верного ответа — проверим их ещё раз позже.'))) + '</p>' : '<p>' + esc(t(L('Бүгін қате жоқ. Жарайсың!', 'Сегодня без ошибок. Молодец!'))) + '</p>'));
    if (a.newBadges && a.newBadges.length) h += card('<h2>' + esc(t(L('Жаңа белгі', 'Новый значок'))) + '</h2>' + badgesHtml({ badges: st.badges.filter(function (b) { return a.newBadges.indexOf(b.id) >= 0; }) }), 'hl');
    h += '<div class="row wrap-row"><a class="btn pri big" href="#home">' + esc(t(TX.home)) + '</a><a class="btn" href="#mistakes">' + esc(t(TX.mistakes)) + '</a><a class="btn" href="#attempt-' + a.aid + '">' + esc(t(L('Барлық тапсырма', 'Все задания'))) + '</a></div>';
    return h;
  };
  var dTimer = null, dLast = 0;
  var startDTimer = function () {
    if (dTimer) return; dLast = Date.now();
    dTimer = setInterval(function () {
      var ses = S.sessions.daily; if (!ses || route() !== 'daily') { stopDTimer(); return; }
      var now = Date.now(); ses.elapsed = (ses.elapsed || 0) + Math.min(now - dLast, 5000); dLast = now;
      if (Math.floor(now / 1000) % 10 === 0) save();
    }, 1000);
  };
  var stopDTimer = function () { if (dTimer) clearInterval(dTimer); dTimer = null; };
  var dAct = function (a, v) {
    var ses = S.sessions.daily; if (!ses && a !== 'd-start') return false;
    var it = ses ? ses.items[ses.cur] : null;
    switch (a) {
      case 'd-start': startDaily(v); return true;
      case 'd-begin': ses.intro[it.r] = true; save(); render(); window.scrollTo(0, 0); return true;
      case 'd-pick': if (!it.done) { it.sel = +v; save(); render(); } return true;
      case 'd-hint': it.hint = true; save(); render(); return true;
      case 'd-check':
        if (it.done || it.sel === null || it.sel === undefined) return true;
        var inst = NP.build(it.id, it.seed), tpl = NP.byId[it.id];
        it.done = true; it.ok = record(it, inst, it.sel, 'daily', DTITLE); it.mid = record.lastMid || null;
        var rd = ses.rounds[it.r];
        if (tpl.t === 'enmini') {
          if (rd.place) { var pl = ses.items.filter(function (x) { return x.r === it.r; }); if (pl.every(function (x) { return x.done; })) ses.enPlaced = NP.enPlace(S, pl.map(function (x) { return { id: x.id, ok: x.ok }; })); }
          else it.enChange = NP.enAfter(S, tpl, it.ok);
        }
        save(); render(); return true;
      case 'd-reason':
        var m = S.mistakes.filter(function (x) { return x.mid === it.mid; })[0];
        if (m) { m.reason = v; if (m.status === 'new') m.status = 'work'; save(); render(); } return true;
      case 'd-similar':
        var base = NP.byId[it.id], stat = base.g.length === 0, pick = base;
        if (stat) {
          var inS = {}; ses.items.forEach(function (x) { inS[x.id] = 1; });
          var cands = NP.TPL.filter(function (x) { return x.t === base.t && !inS[x.id] && (!base.lv || Math.abs((x.lv || 1) - base.lv) <= 1); });
          pick = cands.filter(function (x) { return x.k === base.k; })[0] || cands[0];
        }
        if (!pick) { flash = t(L('Бұл тақырыпта жаңа ұқсас тапсырма қалмады.', 'В этой теме больше нет новых похожих заданий.')); render(); return true; }
        it.simAdded = true;
        ses.items.splice(ses.cur + 1, 0, { id: pick.id, seed: stat ? 1 : Math.floor(Math.random() * 2e9) + 1, s: pick.s, r: it.r, slot: 'similar', sel: null, done: false, hint: false, mid: null });
        ses.cur++; flash = null; save(); render(); window.scrollTo(0, 0); return true;
      case 'd-next':
        if (!it.done) return true;
        if (ses.cur >= ses.items.length - 1) { finishDaily(); return true; }
        ses.cur++; save(); render(); window.scrollTo(0, 0); return true;
      case 'd-prev': if (ses.cur > 0) { ses.cur--; ses.intro[ses.items[ses.cur].r] = true; save(); render(); window.scrollTo(0, 0); } return true;
    }
    return false;
  };

  /* ---------------- Рендер ---------------- */
  var render = function () {
    var r = route(), main;
    document.documentElement.lang = S.ui === 'kk' ? 'kk' : 'ru';
    if (r.indexOf('run-') !== 0) stopTicker();
    if (r === 'home') main = viewHome();
    else if (r === 'learn') main = viewLearn();
    else if (r.indexOf('learn-') === 0) main = viewTopic(r.slice(6));
    else if (r === 'diag') main = viewDiag();
    else if (r === 'exam') main = viewExam();
    else if (r.indexOf('run-') === 0) { main = viewRun(r.slice(4)); }
    else if (r.indexOf('attempt-') === 0) main = viewAttempt(r.slice(8));
    else if (r === 'results') main = viewResults();
    else if (r === 'mistakes') main = viewMistakes();
    else if (r === 'plan') main = viewPlan();
    else if (r === 'data') main = viewData();
    else if (r === 'daily') main = viewDaily();
    else if (r.indexOf('dsum-') === 0) main = viewDSum(r.slice(5));
    else main = viewHome();
    document.getElementById('app').innerHTML = shell(main);
    if (r.indexOf('run-') === 0 && S.sessions[r.slice(4)] && !tickTimer) startTicker();
    if (r === 'daily' && S.sessions.daily) startDTimer(); else stopDTimer();
  };

  /* ---------------- События ---------------- */
  document.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
    var a = el.getAttribute('data-act'), v = el.getAttribute('data-v');
    if (el.type === 'checkbox') return; /* обрабатываются в change */
    var ses = curSlot ? S.sessions[curSlot] : null;
    switch (a) {
      case 'ui': S.ui = v; save(); render(); break;
      case 'd-start': case 'd-begin': case 'd-pick': case 'd-hint': case 'd-check': case 'd-reason': case 'd-similar': case 'd-next': case 'd-prev': dAct(a, v); break;
      case 'ql': S.ql = v; save(); render(); break;
      case 'modal-no': modal = null; render(); break;
      case 'modal-yes': var f = modal && modal.onYes; modal = null; if (f) f(); else render(); break;
      case 'open-run': go('run-' + v); break;
      case 'diag': startSession('test', NP.makeDiag(v)); break;
      case 'topic-test': startSession('test', NP.makeTopicTest(v)); break;
      case 'practice-topic': startSession('practice', NP.makePractice({ topic: v }, 0, 6, L('Жаттығу: ' + NP.TOPICS[v].name.kk, 'Практика: ' + NP.TOPICS[v].name.ru))); break;
      case 'exam-start': var pr = v.split('-'); startSession('full', NP.makeExam(+pr[0], pr[1])); break;
      case 'drop-full': ask(esc(t(L('Аяқталмаған сынақ нәтижесіз жабылады. Жалғастыру керек пе?', 'Незавершённый тест будет закрыт без результата. Продолжить?'))), t(L('Иә, жабу', 'Да, закрыть')), function () { S.sessions.full = null; save(); render(); }); break;
      case 'prev': move(-1); break;
      case 'next': move(1); break;
      case 'jump': jump(+v); break;
      case 'pick':
        if (!ses) break; var si = NP.secIndex(ses, ses.cur);
        if (ses.timed && ses.sections[si].locked) break;
        if (ses.mode === 'study' && ses.checked[ses.cur]) break;
        ses.answers[ses.cur] = +v; save(); render(); break;
      case 'flag': if (ses) { if (ses.flags[ses.cur]) delete ses.flags[ses.cur]; else ses.flags[ses.cur] = true; save(); render(); } break;
      case 'hint': if (ses) { ses.hints[ses.cur] = true; save(); render(); } break;
      case 'check':
        if (!ses || ses.answers[ses.cur] === undefined) break;
        ses.checked[ses.cur] = true;
        var it = ses.items[ses.cur]; record(it, NP.inst(it), ses.answers[ses.cur], ses.kind === 'practice' ? 'practice' : ses.kind, ses.title);
        save(); render(); break;
      case 'similar':
        if (!ses) break; var base = NP.TPL.length && NP.byId[ses.items[ses.cur].id];
        var sameT = NP.TPL.filter(function (x) { return x.t === base.t; });
        var stat = ['sci', 'kk', 'ru', 'en'].indexOf(base.s) >= 0;
        var pick = stat ? sameT.filter(function (x) { return !ses.items.some(function (y) { return y.id === x.id; }); })[0] : base;
        if (!pick) { flash = t(L('Бұл тақырыпта жаңа ұқсас тапсырма қалмады. Басқа тақырыпты таңдаңыз.', 'В этой теме больше нет новых похожих заданий. Выберите другую тему.')); render(); break; }
        ses.items.push({ id: pick.id, seed: stat ? 1 : Math.floor(Math.random() * 2e9) + 1, sec: 'all', s: pick.s });
        ses.sections[0].to = ses.items.length - 1; ses.cur = ses.items.length - 1; flash = null; save(); render(); break;
      case 'end-sec':
        if (!ses) break; ask(esc(t(L('Бөлім аяқталады және оған қайта оралып, жауапты өзгертуге болмайды. Жалғастыру керек пе?', 'Раздел будет завершён, вернуться и изменить ответы в нём будет нельзя. Продолжить?'))), t(L('Бөлімді аяқтау', 'Завершить раздел')), function () {
          var k = NP.secIndex(ses, ses.cur); ses.sections[k].locked = true; var nx = -1;
          for (var q = k + 1; q < ses.sections.length; q++) if (!ses.sections[q].locked) { nx = q; break; }
          if (nx < 0) finishSession(curSlot); else { ses.cur = ses.sections[nx].from; save(); render(); }
        }); break;
      case 'finish':
        if (!ses) break;
        var un = ses.items.length - Object.keys(ses.answers).length, fl = Object.keys(ses.flags).length;
        ask(esc(t(L('Тестті аяқтау керек пе? Жауап берілмеген: ', 'Завершить тест? Без ответа: '))) + un + (fl ? esc(t(L('; белгіленген: ', '; отмечено: '))) + fl : '') + '.', t(L('Аяқтау', 'Завершить')), function () { finishSession(curSlot); }); break;
      case 'step': var hidden = document.querySelector('#steps li[hidden]'); if (hidden) hidden.hidden = false; if (!document.querySelector('#steps li[hidden]')) el.hidden = true; break;
      case 'm-series':
        var m = S.mistakes.filter(function (x) { return x.mid === v; })[0]; if (!m) break;
        if (m.status === 'new') m.status = 'work'; m.next = m.next || 'series';
        startSession('practice', NP.makePractice({ skill: m.s + ':' + m.k, topicFallback: m.t }, 0, 5, L('Ұқсас тапсырмалар: ' + (NP.SKILL[m.k] || L(m.k, m.k)).kk, 'Похожие задания: ' + (NP.SKILL[m.k] || L(m.k, m.k)).ru)));
        break;
      case 'm-work': var m2 = S.mistakes.filter(function (x) { return x.mid === v; })[0]; if (m2) { m2.status = 'work'; save(); render(); } break;
      case 'plan-make':
        var ns = +document.getElementById('pl-s').value, nm = +document.getElementById('pl-m').value;
        S.plan = buildPlan(ns, nm); save(); render(); break;
      case 't-move':
        var f2 = findTask(v); if (!f2) break; f2.d.tasks.splice(f2.ti, 1);
        var nd = S.plan.days[f2.di + 1];
        if (!nd) { var last = S.plan.days[S.plan.days.length - 1].date.split('-'); var dt = new Date(+last[0], +last[1] - 1, +last[2] + 1); nd = { date: dayKey(dt.getTime()), tasks: [] }; S.plan.days.push(nd); }
        f2.tk.moved = (f2.tk.moved || 0) + 1; nd.tasks.unshift(f2.tk); save(); render(); break;
      case 't-go':
        var f3 = findTask(v); if (!f3) break; var tk = f3.tk;
        if (tk.kind === 'diag') startSession('test', NP.makeDiag(tk.sub));
        else if (tk.kind === 'lesson') go('learn-' + tk.topic);
        else if (tk.kind === 'practice') startSession('practice', NP.makePractice({ topic: tk.topic }, 0, 6, L('Жаттығу: ' + NP.TOPICS[tk.topic].name.kk, 'Практика: ' + NP.TOPICS[tk.topic].name.ru)));
        else if (tk.kind === 'mistakes') { mf.st = 'open'; go('mistakes'); }
        else if (tk.kind === 'check') startSession('test', NP.makeCheck(tk.topics && tk.topics.length ? tk.topics : ['frac', 'pct', 'qcnum', 'qcvar']));
        break;
      case 'exp-file':
        var txt = exportText(), msg = document.getElementById('exp-msg');
        var fname = 'nis-prep-' + dayKey(Date.now()) + '.json';
        var plainDl = function () { try { var blob = new Blob([txt], { type: 'application/json' }), aEl = document.createElement('a'); aEl.href = URL.createObjectURL(blob); aEl.download = fname; document.body.appendChild(aEl); aEl.click(); aEl.remove(); } catch (e) { } };
        if (dlApi) dlApi.save({ filename: fname, data: txt }).then(function () { if (msg) msg.textContent = t(L('Файл сақталды.', 'Файл сохранён.')); }, function () { });
        else plainDl();
        var ta = document.getElementById('exp-out'); ta.hidden = false; ta.value = txt;
        if (msg) msg.textContent = t(L('Егер жүктеу басталмаса (кейбір қарау терезелерінде файл жүктеуге тыйым салынған), төмендегі мәтінді көшіріп, .json файл ретінде сақтаңыз.', 'Если скачивание не началось (в некоторых окнах просмотра оно запрещено), скопируйте текст ниже и сохраните как файл .json.'));
        break;
      case 'exp-copy':
        var txt2 = exportText(), ta2 = document.getElementById('exp-out'), msg2 = document.getElementById('exp-msg'); ta2.hidden = false; ta2.value = txt2;
        var done = function () { if (msg2) msg2.textContent = t(L('Көшірілді.', 'Скопировано.')); };
        var fail = function () { ta2.focus(); ta2.select(); if (msg2) msg2.textContent = t(L('Автоматты көшіру мүмкін болмады — мәтін белгіленді, оны қолмен көшіріңіз.', 'Автоматически скопировать не удалось — текст выделен, скопируйте вручную.')); };
        try { navigator.clipboard.writeText(txt2).then(done, fail); } catch (e) { fail(); }
        break;
      case 'imp-text': importData(document.getElementById('imp-text').value); break;
      case 'reset': ask(esc(t(L('Барлық прогресс, қателер мен жоспар өшіріледі. Бұл әрекетті қайтару мүмкін емес.', 'Будут удалены весь прогресс, ошибки и план. Это действие необратимо.'))), t(L('Иә, өшіру', 'Да, удалить')), function () { var ui = S.ui, ql = S.ql; S = fresh(); S.ui = ui; S.ql = ql; save(); flash = t(L('Деректер өшірілді.', 'Данные удалены.')); go('home'); }); break;
    }
  });
  document.addEventListener('change', function (ev) {
    var el = ev.target, a = el.getAttribute && el.getAttribute('data-act'), v = el.getAttribute && el.getAttribute('data-v');
    if (el.id === 'imp-file' && el.files && el.files[0]) { var rd = new FileReader(); rd.onload = function () { importData(String(rd.result)); }; rd.onerror = function () { importData(''); }; rd.readAsText(el.files[0]); return; }
    if (!a) return;
    if (a === 'mf-st') { mf.st = el.value; render(); }
    else if (a === 'mf-s') { mf.s = el.value; render(); }
    else if (a === 'm-reason' || a === 'm-next') { var m = S.mistakes.filter(function (x) { return x.mid === v; })[0]; if (m) { if (a === 'm-reason') m.reason = el.value || null; else m.next = el.value || null; if (m.status === 'new' && el.value) m.status = 'work'; save(); render(); } }
    else if (a === 't-done') { var f = findTask(v); if (f) { f.tk.done = el.checked; save(); render(); } }
    else if (a === 'onlywrong') { window.__onlyWrong = el.checked; render(); }
  });
  document.addEventListener('keydown', function (ev) {
    if (route().indexOf('run-') !== 0 || modal) return;
    var tag = (ev.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); move(1); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); move(-1); }
  });
  window.addEventListener('beforeunload', save);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); else lastTick = Date.now(); });

  /* В просмотрщике claude.ai файл отдаётся через возможность downloads; в обычном браузере — обычной ссылкой */
  var dlApi = null;
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(function (d) { dlApi = d; }, function () { }); } catch (e) { }
  NP.app = { state: function () { return S; }, render: render };
  render();
})();
